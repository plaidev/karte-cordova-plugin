name: "Sync to mirror repo"
on:
  push:
    branches:
      - master
  workflow_dispatch: # Enable manual execution for troubleshooting
jobs:
  sync-to-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Should be executed on the dev repo.
    if: github.repository != 'plaidev/karte-cordova-plugin'
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: app-token
        with:
          app-id: ${{ secrets.APP_TEAM_GITHUB_APP_ID }}
          private-key: ${{ secrets.APP_TEAM_GITHUB_APP_PRIVATE_KEY }}
          owner: plaidev
          repositories: |
            karte-cordova-plugin
      - name: Checkout master
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Git
        run: |
          git config --global user.email "git@users.noreply.github.com"
          git config --global user.name "github actions"
      - name: Push to mirror repository
        run: |
          git remote add mirror https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/plaidev/karte-cordova-plugin.git
          git pull mirror master --no-rebase --no-edit
          git push mirror master
      - name: Notify Slack on success
        if: success()
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2.3.3
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: |
            ✅ Successfully synced changes to mirror repo master branch
          SLACK_COLOR: success
      - name: Notify Slack on failure
        if: failure()
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2.3.3
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: |
            ❌ Failed to sync changes to mirror repo
          SLACK_COLOR: failure
